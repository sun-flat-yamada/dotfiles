# ==============================================================================
# WSL2 Guest Distribution Configuration (/etc/wsl.conf)
# Copy into /etc/wsl.conf inside your Ubuntu / Linux WSL2 distribution.
# ==============================================================================

[boot]
systemd=true

[automount]
enabled=true
mountFsTab=true
root=/mnt/
options="metadata,umask=22,fmask=11"

[interop]
enabled=true
appendWindowsPath=true

[network]
generateHosts=true
generateResolvConf=true
