# ==============================================================================
# Starship Cross-Shell Prompt (~/.config/starship.toml)
# Author: Youhei Yamada (@sun-flat-yamada)
# Theme: Dark 2026 (Purple #a94dc1 / Gold #ffd866 / Cyan #00B3BD / Mint #78e8c6)
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
scan_timeout = 30
command_timeout = 1000
palette = "dark_2026"

format = """
$os\
$directory\
$git_branch\
$git_status\
$git_metrics\
$nodejs\
$python\
$golang\
$rust\
$dotnet\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[palettes.dark_2026]
bg_deep = "#171c2a"
purple = "#a94dc1"
violet = "#5332a0"
gold = "#ffd866"
cyan = "#00B3BD"
mint = "#78e8c6"
green = "#52AB62"
red = "#E35535"
magenta = "#e991e3"
white = "#ffffff"
muted = "#5c6d74"

[os]
disabled = false
style = "bold purple"

[os.symbols]
Windows = "󰍲 "
Ubuntu = "󰕈 "
Linux = "󰌽 "
Macos = "󰀵 "

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

[character]
success_symbol = "[❯](bold gold)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mint)"

[git_branch]
symbol = "󰘬 "
style = "bold magenta"
format = "on [$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "bold gold"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "via [$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "bold gold"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[golang]
symbol = "󰟓 "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "bold red"
format = "via [$symbol($version )]($style)"

[dotnet]
symbol = "󰪮 "
style = "bold purple"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = "󰡨 "
style = "bold cyan"
only_with_files = true

[cmd_duration]
min_time = 2000
style = "bold gold"
format = "took [$duration]($style) "
