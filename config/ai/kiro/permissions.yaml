      - "claude plugin *"
      - "codex mcp add*"
      - "gemini mcp add*"
      - "gemini extensions install*"
      - "code --install-extension *"
      - "cursor --install-extension *"
    effect: ask
  # C-HITL-07 Leaving the sandbox; MCP servers, plugins, and extensions
  - capability: fs_write
    match:
      - ".mcp.json"
      - "**/.mcp.json"
      - ".vscode/mcp.json"
      - ".cursor/mcp.json"
    effect: ask
  # C-HITL-08 Dumping the process environment
  - capability: shell
    match:
