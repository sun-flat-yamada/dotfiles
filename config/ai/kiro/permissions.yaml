      - "git -c diff.external=*"
      - "git config core.fsmonitor *"
      - "git config core.sshCommand *"
      - "git config diff.external *"
      - "git config credential.helper *"
      - "git config * credential.helper *"
    effect: ask
  # C-HITL-10 Git configuration that runs a program
  - capability: fs_write
    match:
      - ".git/config"
      - ".git/hooks/**"
    effect: ask
  # A-04 Web search
  - capability: web_search
    match:
      - "*"
    effect: allow
  # C-NET-01 Package registries
  - capability: sandbox_network
    match:
