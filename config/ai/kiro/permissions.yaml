  # C-HITL-05 AI, CI, and governance configuration
  - capability: fs_write
    match:
      - ".claude/**"
      - ".codex/**"
      - ".cursor/**"
      - ".gemini/**"
      - ".vscode/**"
      - ".agents/**"
      - ".github/**"
      - ".githooks/**"
