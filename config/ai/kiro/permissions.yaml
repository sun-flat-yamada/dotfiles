# Generated by scripts/sync-permissions.py from .agents/permissions/permission-policy.json.
# Do not edit by hand: change the canonical definition and run the script with --write.
rules:
  # N-01 Secret access
  - capability: shell
    match:
      - "git credential fill*"
      - "op read *"
      - "op item get *"
      - "vault kv get *"
      - "vault read *"
      - "pass show *"
      - "security find-generic-password*"
      - "security find-internet-password*"
      - "security dump-keychain*"
      - "kubectl config view * --raw*"
      - "kubectl config view --raw*"
      - "aws ecr get-login-password*"
      - "gh auth token*"
      - "gh auth status * --show-token*"
      - "kubectl get secret*"
      - "aws secretsmanager get-secret-value*"
      - "gcloud auth print-access-token*"
      - "gcloud auth print-identity-token*"
      - "az account get-access-token*"
    effect: deny
  # N-01 Secret access
  - capability: filesystem
    match:
      - "**/.env"
      - "**/.env.*"
      - "**/*.env"
      - "**/*.pem"
      - "**/*.key"
      - "**/*.p12"
      - "**/*.pfx"
      - "**/*.jks"
      - "**/*.keystore"
      - "**/*.kdbx"
      - "**/id_rsa"
      - "**/id_dsa"
      - "**/id_ecdsa"
      - "**/id_ed25519"
      - "**/*.tfstate"
      - "**/*.tfstate.backup"
      - "**/credentials.json"
      - "**/client_secret*.json"
      - "**/service-account*.json"
      - "**/service_account*.json"
      - "**/.npmrc"
      - "**/.pypirc"
      - "**/.netrc"
      - "**/.git-credentials"
      - "~/.ssh/**"
      - "~/.gnupg/**"
      - "~/.aws/**"
      - "~/.azure/**"
      - "~/.config/gcloud/**"
      - "~/.kube/**"
      - "~/.docker/config.json"
      - "~/.config/gh/**"
      - "~/.git-credentials"
      - "~/.netrc"
      - "~/.npmrc"
      - "~/.pypirc"
      - "~/.gem/credentials"
      - "~/.cargo/credentials"
      - "~/.cargo/credentials.toml"
      - "~/.claude/.credentials.json"
      - "~/.codex/auth.json"
      - "~/.gemini/oauth_creds.json"
      - "~/.claude.json"
      - "~/.claude/history.jsonl"
      - "~/.codex/history.jsonl"
      - "~/.config/github-copilot/**"
      - "~/.local/share/opencode/auth.json"
      - "~/.config/op/**"
      - "~/.vault-token"
      - "~/.terraform.d/credentials.tfrc.json"
      - "**/*.ppk"
      - "**/*.ovpn"
      - "~/.bash_history"
      - "~/.zsh_history"
      - "~/.local/state/zsh_history"
      - "~/AppData/Roaming/Microsoft/Windows/PowerShell/PSReadLine/**"
      - "~/.gitconfig.local"
      - "~/.powershell.local.ps1"
      - "~/.zshrc.local"
      - "~/.bashrc.local"
      - "**/.secrets"
      - "~/Library/Keychains/**"
      - "/proc/*/environ"
    exclude:
      - "**/.env.example"
      - "**/.env.sample"
      - "**/.env.template"
    effect: deny
  # N-03 Privilege escalation and host modification
  - capability: shell
    match:
      - "sudo *"
      - "su *"
      - "doas *"
      - "pkexec *"
      - "crontab *"
      - "runas *"
      - "gsudo *"
      - "schtasks /create*"
      - "launchctl load *"
      - "launchctl bootstrap *"
      - "systemctl enable *"
      - "systemctl --user enable *"
      - "Start-Process * -Verb RunAs*"
      - "Register-ScheduledTask *"
      - "New-Service *"
    effect: deny
  # N-03 Privilege escalation and host modification
  - capability: fs_write
    match:
      - "~/.bashrc"
      - "~/.bash_profile"
      - "~/.zshrc"
      - "~/.zprofile"
      - "~/.profile"
      - "~/.zshenv"
      - "~/.zlogin"
      - "~/.bash_login"
      - "~/.bash_logout"
      - "~/.config/fish/config.fish"
      - "~/Library/LaunchAgents/**"
      - "~/.config/systemd/user/**"
      - "~/.config/autostart/**"
      - "~/Documents/PowerShell/**"
      - "~/.config/powershell/**"
      - "~/.ssh/**"
      - "~/.gitconfig"
      - "/etc/**"
      - "/usr/**"
    effect: deny
  # N-04 Disabling guardrails
  - capability: shell
    match:
      - "* --dangerously-skip-permissions*"
      - "* --allow-dangerously-skip-permissions*"
      - "* --permission-mode bypassPermissions*"
      - "* --permission-mode=bypassPermissions*"
      - "* --dangerously-bypass-approvals-and-sandbox*"
      - "* --yolo*"
      - "* --approval-mode yolo*"
      - "* --approval-mode=yolo*"
      - "* --trust-all-tools*"
      - "* --allow-all-tools*"
      - "* danger-full-access*"
      - "git * --no-verify*"
      - "git commit -n*"
      - "git -c core.hooksPath*"
      - "git config core.hooksPath *"
      - "git config * core.hooksPath *"
      - "git config --unset* core.hooksPath*"
      - "git config unset core.hooksPath*"
      - "Set-MpPreference *"
      - "Add-MpPreference *"
    effect: deny
  # N-04 Disabling guardrails
  - capability: fs_write
    match:
      - "~/.claude/settings.json"
      - "~/.codex/config.toml"
      - "~/.gemini/settings.json"
    effect: deny
  # N-05 Irreversible destruction
  - capability: shell
    match:
      - "git push --force*"
      - "git push * --force*"
      - "git push -f*"
      - "git push * -f"
      - "git push * -f *"
      - "git push --mirror*"
      - "git push * --mirror*"
      - "git push --delete *"
      - "git push * --delete *"
      - "git push -d *"
      - "git push * -d *"
      - "git push * :*"
      - "git push * +*"
      - "rm -rf /"
      - "rm -rf ~"
      - "rm -rf ~/"
      - "rm -rf $HOME"
      - "rm -rf ."
      - "rm -rf .."
      - "mkfs*"
      - "dd *"
      - "shutdown*"
      - "reboot*"
      - "halt*"
      - "poweroff*"
      - "gh repo delete*"
      - "diskpart *"
      - "vssadmin *"
      - "rm -fr /"
      - "rm -fr ~"
      - "rm -fr ."
      - "Format-Volume *"
      - "Clear-Disk *"
      - "Stop-Computer*"
      - "Restart-Computer*"
    effect: deny
  # N-06 Executing untrusted remote code
  - capability: shell
    match:
      - "powershell * -EncodedCommand*"
      - "pwsh * -EncodedCommand*"
      - "powershell -EncodedCommand*"
      - "pwsh -EncodedCommand*"
      - "git clone ext::*"
      - "sh"
      - "bash"
      - "zsh"
      - "dash"
      - "ksh"
      - "sh -s*"
      - "bash -s*"
      - "python"
      - "python3"
      - "node"
      - "perl"
      - "ruby"
      - "git fetch ext::*"
      - "git pull ext::*"
      - "git ls-remote ext::*"
      - "powershell -enc *"
      - "pwsh -enc *"
      - "powershell * -enc *"
      - "pwsh * -enc *"
      - "Invoke-Expression *"
      - "* -EncodedCommand *"
    effect: deny
  # N-07 Production and shared-infrastructure mutation
  - capability: shell
    match:
      - "gh secret *"
      - "gh variable *"
      - "terraform destroy*"
      - "terraform apply -auto-approve*"
      - "terraform apply * -auto-approve*"
      - "tofu destroy*"
      - "pulumi destroy*"
      - "cdk destroy*"
      - "kubectl delete namespace*"
      - "kubectl delete ns *"
      - "kubectl delete * --all*"
      - "aws s3 rb *"
      - "aws s3 rm * --recursive*"
      - "gcloud projects delete*"
      - "az group delete*"
      - "dropdb *"
      - "gh api */actions/secrets*"
    effect: deny
  # N-08 Self-approval and protected branches
  - capability: shell
    match:
      - "git push * HEAD:main*"
      - "git push * HEAD:master*"
      - "git push * main"
      - "git push * master"
      - "git push * main *"
      - "git push * master *"
      - "gh pr merge*"
      - "gh pr review * --approve*"
      - "gh pr review --approve*"
      - "gh auth refresh*"
      - "gh ssh-key add*"
      - "gh gpg-key add*"
      - "gh repo deploy-key add*"
      - "gh api * -X PUT */merge*"
      - "gh api */pulls/*/merge*"
      - "gh api */protection*"
    effect: deny
  # N-09 Exfiltration channels
  - capability: shell
    match:
      - "gh gist create*"
      - "gh repo create * --public*"
      - "gh repo edit * --visibility public*"
      - "gh repo edit * --visibility=public*"
      - "ngrok *"
      - "cloudflared tunnel*"
      - "ssh -R *"
      - "* /dev/tcp/*"
    effect: deny
  # N-09 Exfiltration channels
  - capability: web_fetch
    match:
      - "https://169.254.169.254*"
      - "https://metadata.google.internal*"
      - "https://pastebin.com*"
      - "https://paste.ee*"
      - "https://hastebin.com*"
      - "https://transfer.sh*"
      - "https://0x0.st*"
      - "https://termbin.com*"
      - "https://webhook.site*"
      - "https://*.pipedream.net*"
      - "https://*.ngrok.io*"
      - "https://*.ngrok-free.app*"
      - "https://*.ngrok.app*"
      - "https://*.trycloudflare.com*"
      - "https://*.interact.sh*"
      - "https://*.oast.fun*"
      - "https://*.oast.pro*"
      - "https://*.oast.live*"
      - "https://*.burpcollaborator.net*"
      - "https://oastify.com*"
      - "https://*.oastify.com*"
      - "https://requestcatcher.com*"
      - "https://*.requestcatcher.com*"
      - "https://*.beeceptor.com*"
      - "https://canarytokens.com*"
      - "https://*.ngrok.dev*"
      - "https://localhost.run*"
      - "https://*.localhost.run*"
      - "https://serveo.net*"
      - "https://*.serveo.net*"
      - "https://*.loca.lt*"
      - "https://file.io*"
      - "https://gofile.io*"
      - "https://tmpfiles.org*"
      - "https://catbox.moe*"
      - "https://*.catbox.moe*"
      - "https://bashupload.com*"
      - "https://dpaste.com*"
      - "https://api.imgur.com*"
      - "https://hooks.slack.com*"
      - "https://api.telegram.org*"
    effect: deny
  # N-09 Exfiltration channels
  - capability: sandbox_network
    match:
      - "169.254.169.254"
      - "metadata.google.internal"
      - "pastebin.com"
      - "paste.ee"
      - "hastebin.com"
      - "transfer.sh"
      - "0x0.st"
      - "termbin.com"
      - "webhook.site"
      - "*.pipedream.net"
      - "*.ngrok.io"
      - "*.ngrok-free.app"
      - "*.ngrok.app"
      - "*.trycloudflare.com"
      - "*.interact.sh"
      - "*.oast.fun"
      - "*.oast.pro"
      - "*.oast.live"
      - "*.burpcollaborator.net"
      - "oastify.com"
      - "*.oastify.com"
      - "requestcatcher.com"
      - "*.requestcatcher.com"
      - "*.beeceptor.com"
      - "canarytokens.com"
      - "*.ngrok.dev"
      - "localhost.run"
      - "*.localhost.run"
      - "serveo.net"
      - "*.serveo.net"
      - "*.loca.lt"
      - "file.io"
      - "gofile.io"
      - "tmpfiles.org"
      - "catbox.moe"
      - "*.catbox.moe"
      - "bashupload.com"
      - "dpaste.com"
      - "api.imgur.com"
      - "hooks.slack.com"
      - "api.telegram.org"
    effect: deny
  # N-10 Publishing and registry credentials
  - capability: shell
    match:
      - "gh release create*"
      - "gh release upload*"
      - "gh release delete*"
      - "gh auth login*"
      - "npm publish*"
      - "npm unpublish*"
      - "npm deprecate*"
      - "npm dist-tag*"
      - "npm owner*"
      - "npm token*"
      - "npm login*"
      - "npm adduser*"
      - "pnpm publish*"
      - "yarn publish*"
      - "yarn npm publish*"
      - "bun publish*"
      - "twine upload*"
      - "uv run *twine upload*"
      - "uvx *twine upload*"
      - "poetry run *twine upload*"
      - "pipx run *twine upload*"
      - "python* -m twine upload*"
      - "uv publish*"
      - "poetry publish*"
      - "cargo publish*"
      - "cargo yank*"
      - "cargo owner*"
      - "cargo login*"
      - "dotnet nuget push*"
      - "dotnet nuget delete*"
      - "nuget push*"
      - "dart pub publish*"
      - "flutter pub publish*"
      - "gem push*"
      - "docker push*"
      - "docker login*"
      - "podman push*"
    effect: deny
  # N-11 Container escape
  - capability: shell
    match:
      - "docker run --privileged*"
      - "docker run * --privileged*"
      - "docker run * -v /:*"
      - "docker * /var/run/docker.sock*"
    effect: deny
  # N-12 Audit trail tampering
  - capability: shell
    match:
      - "history -c*"
      - "unset HISTFILE*"
      - "rm * ~/.claude/projects*"
      - "rm * ~/.codex/sessions*"
      - "Clear-History*"
      - "Clear-EventLog *"
    effect: deny
  # N-12 Audit trail tampering
  - capability: fs_write
    match:
      - "~/.claude/projects/**"
      - "~/.codex/sessions/**"
    effect: deny
  # C-HITL Unresolved or host-management commands (default ask)
  - capability: shell
    match:
      - "eval *"
      - "systemctl *"
      - "launchctl *"
      - "Start-Process *"
      - "Set-ExecutionPolicy *"
    effect: ask
  # C-HITL-01 Outward VCS and collaboration
  - capability: shell
    match:
      - "git push *"
      - "git clone *"
      - "git submodule add *"
      - "git remote add *"
      - "git remote set-url *"
      - "gh *"
    effect: ask
  # C-HITL-02 Dependency changes
  - capability: shell
    match:
      - "npm install *"
      - "npm i *"
      - "npm add *"
      - "npm update *"
      - "npm uninstall *"
      - "npm exec *"
      - "npx *"
      - "pnpm add *"
      - "pnpm update *"
      - "pnpm remove *"
      - "pnpm dlx *"
      - "yarn add *"
      - "yarn upgrade *"
      - "yarn remove *"
      - "yarn dlx *"
      - "bun add *"
      - "bun update *"
      - "bun remove *"
      - "bunx *"
      - "pip install *"
      - "pip3 install *"
      - "pip uninstall *"
      - "python -m pip *"
      - "python3 -m pip *"
      - "uv add *"
      - "uv remove *"
      - "uv pip install *"
      - "uv tool install *"
      - "uvx *"
      - "poetry add *"
      - "poetry remove *"
      - "pipx *"
      - "cargo add *"
      - "cargo remove *"
      - "cargo install *"
      - "cargo update*"
      - "go get *"
      - "go install *"
      - "dotnet add *"
      - "dotnet remove *"
      - "dotnet tool install *"
      - "dart pub add *"
      - "dart pub remove *"
      - "dart pub upgrade*"
      - "flutter pub add *"
      - "flutter pub upgrade*"
      - "brew install *"
      - "choco install *"
      - "winget install *"
      - "scoop install *"
    effect: ask
  # C-HITL-02 Dependency changes
  - capability: fs_write
    match:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/npm-shrinkwrap.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/bun.lock"
      - "**/bun.lockb"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - "**/uv.lock"
      - "**/poetry.lock"
      - "**/Pipfile"
      - "**/Pipfile.lock"
      - "**/setup.py"
      - "**/setup.cfg"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/go.mod"
      - "**/go.sum"
      - "**/*.csproj"
      - "**/Directory.Packages.props"
      - "**/packages.lock.json"
      - "**/NuGet.config"
      - "**/pubspec.yaml"
      - "**/pubspec.lock"
      - "**/vcpkg.json"
      - "**/conanfile.txt"
      - "**/conanfile.py"
    effect: ask
  # C-HITL-03 Destructive local operations
  - capability: shell
    match:
      - "git reset --hard*"
      - "git clean *"
      - "git restore *"
      - "git checkout -- *"
      - "git stash drop*"
      - "git stash clear*"
      - "git branch -D *"
      - "git filter-branch *"
      - "git filter-repo *"
      - "git reflog expire*"
      - "git gc --prune=now*"
      - "rm -r *"
      - "rm -rf *"
      - "rm -fr *"
      - "rm -R *"
      - "rm -Rf *"
      - "rm --recursive *"
      - "find * -delete*"
      - "kill *"
      - "pkill *"
      - "killall *"
      - "Remove-Item * -Recurse*"
      - "Remove-Item -Recurse*"
      - "Stop-Process *"
    effect: ask
  # C-HITL-04 Network access through the shell
  - capability: shell
    match:
      - "curl *"
      - "wget *"
      - "ssh *"
      - "scp *"
      - "sftp *"
      - "rsync *"
      - "ftp *"
      - "nc *"
      - "ncat *"
      - "netcat *"
      - "socat *"
      - "telnet *"
      - "ping *"
      - "dig *"
      - "nslookup *"
      - "host *"
