name: "CI Pipeline"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-linux:
    name: "Validate & Test (Ubuntu / POSIX)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Syntax & Compilation Check
        run: |
          python -m py_compile scripts/dotfiles.py scripts/apply-template.py scripts/install-hooks.py scripts/validate-filenames.py scripts/validate-frontmatter.py .claude/hooks/permission-guard.py tests/test-dotfiles.py tests/test-permission-guard.py tests/test-validate-frontmatter.py

      - name: Dotfiles Manifest & Config Validation
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python scripts/dotfiles.py validate

      - name: Unit & Integration Tests (Linux)
        run: |
          python tests/test-dotfiles.py -v
          python tests/test-permission-guard.py -v
          python tests/test-validate-frontmatter.py -v

      - name: Repository Governance Checks (Front-Matter, Filenames, Placeholders)
        run: |
          python scripts/validate-frontmatter.py
          python scripts/validate-filenames.py
          python scripts/apply-template.py --check

      - name: POSIX Bootstrap Dry-Run & Isolated Install Verification
        run: |
          chmod +x ./install.sh
          ./install.sh --dry-run
          ./install.sh --doctor
          mkdir -p /tmp/dotfiles-ci-home
          ./install.sh --profile full --method symlink --target-home /tmp/dotfiles-ci-home
          ./install.sh --status --target-home /tmp/dotfiles-ci-home

  validate-windows:
    name: "Validate & Test (Windows 11 / PowerShell 7)"
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit & Integration Tests (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python tests/test-dotfiles.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test-permission-guard.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test-validate-frontmatter.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Governance & PowerShell Bootstrap Verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/validate-frontmatter.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate-filenames.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/apply-template.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./install.ps1 -Validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./install.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./install.ps1 -Doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ciHome = Join-Path $env:RUNNER_TEMP "dotfiles-ci-home"
          New-Item -ItemType Directory -Path $ciHome -Force | Out-Null
          ./install.ps1 -Profile full -Method copy -TargetHome $ciHome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./install.ps1 -Status -TargetHome $ciHome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
